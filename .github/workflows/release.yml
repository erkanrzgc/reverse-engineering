name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RUST_VERSION: '1.87.0'

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: reverse-engineering.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: reverse-engineering
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: reverse-engineering
          - os: macos-15
            target: aarch64-apple-darwin
            executable: reverse-engineering
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (no 1.87.0 action tag)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH (got: $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          package_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Release tag does not match Cargo.toml version $package_version" >&2
            exit 1
          fi

      - name: Validate locked tests before packaging
        shell: bash
        run: cargo test --locked --all-features

      - name: Build locked release binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Smoke test binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          test -x "$binary"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Package binary and documentation
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          tag="$GITHUB_REF_NAME"
          package_dir="$RUNNER_TEMP/reverse-engineering-v${tag#v}-$target"
          output_dir="$RUNNER_TEMP/release"
          archive="reverse-engineering-v${tag#v}-$target.tar.gz"
          mkdir -p "$package_dir" "$output_dir"
          cp "target/$target/release/${{ matrix.executable }}" "$package_dir/"
          cp README.md LICENSE CHANGELOG.md "$package_dir/"
          tar -C "$RUNNER_TEMP" -czf "$output_dir/$archive" "$(basename "$package_dir")"

      - name: Generate SHA-256 checksum (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive_dir="$RUNNER_TEMP/release"
          archive="$(basename "$archive_dir"/*.tar.gz)"
          (cd "$archive_dir" && sha256sum "$archive" > "$archive.sha256")

      - name: Generate SHA-256 checksum (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive_dir="$RUNNER_TEMP/release"
          archive="$(basename "$archive_dir"/*.tar.gz)"
          (cd "$archive_dir" && shasum -a 256 "$archive" > "$archive.sha256")

      - name: Generate SHA-256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = Join-Path '${{ runner.temp }}' 'release'
          $archive = Get-ChildItem -LiteralPath $releaseDir -Filter '*.tar.gz' | Select-Object -First 1
          if ($null -eq $archive) { throw "No release archive found in $releaseDir" }
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -LiteralPath (Join-Path $releaseDir "$($archive.Name).sha256") -Encoding ascii

      - name: Upload target package
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download target packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release and checksums
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
